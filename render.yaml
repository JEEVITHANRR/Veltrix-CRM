
services:
  # ─── API Server (Backend Only) ──────────────────────────────
  - type: web
    name: veltrix-api
    env: node
    region: oregon
    plan: free
    buildCommand: echo 'DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder"' > .env && echo 'DIRECT_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder"' >> .env && npm install --include=dev && npm run build --workspace=packages/shared && npm run build --workspace=apps/api && npx prisma generate --schema=prisma/schema.prisma
    startCommand: bash start-api.sh
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        sync: false

  # ─── Background Worker ────────────────────────────────────
  - type: worker
    name: veltrix-worker
    env: node
    region: oregon
    plan: free
    buildCommand: echo 'DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder"' > .env && echo 'DIRECT_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder"' >> .env && npm install --include=dev && npm run build --workspace=apps/worker && npx prisma generate --schema=prisma/schema.prisma
    startCommand: rm -f .env && node apps/worker/dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
