services:
  # ─── API Server ───────────────────────────────────────────
  - type: web
    name: veltrix-api
    env: node
    region: oregon
    plan: free
    buildCommand: export DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder" && npm install --include=dev && npm run build --workspace=packages/shared && npm run build --workspace=apps/api && npx prisma generate --schema=prisma/schema.prisma
    startCommand: npx prisma migrate deploy --schema=prisma/schema.prisma && node apps/api/dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: CORS_ORIGIN
        value: https://veltrix-web.onrender.com

  # ─── Next.js Web Frontend ─────────────────────────────────
  - type: web
    name: veltrix-web
    env: node
    region: oregon
    plan: free
    buildCommand: export DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder" && npm install --include=dev && npm run build --workspace=packages/shared && npm run build --workspace=apps/web
    startCommand: npm run start --workspace=apps/web
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: https://veltrix-api.onrender.com
      - key: NODE_ENV
        value: production

  # ─── Background Worker ────────────────────────────────────
  - type: worker
    name: veltrix-worker
    env: node
    region: oregon
    plan: free
    buildCommand: export DATABASE_URL="postgresql://placeholder:placeholder@localhost:5432/placeholder" && npm install --include=dev && npm run build --workspace=apps/worker && npx prisma generate --schema=prisma/schema.prisma
    startCommand: node apps/worker/dist/index.js
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: OPENAI_API_KEY
        sync: false
